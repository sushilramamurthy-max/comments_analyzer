services:
  - type: web
    name: comment-ledger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: DATA_DIR
        value: /var/data
    disk:
      name: comment-ledger-data
      mountPath: /var/data
      sizeGB: 1
